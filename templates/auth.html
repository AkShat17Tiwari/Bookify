<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKIFY — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #07070d;
            --bg-secondary: #0d0d14;
            --accent-green: #00e68a;
            --accent-purple: #a78bfa;
            --accent-pink: #f472b6;
            --text-primary: #e8e8ef;
            --text-muted: #6b6b80;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* ── Animated background ── */
        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .bg-orbs .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: orbFloat 20s ease-in-out infinite;
        }
        .bg-orbs .orb:nth-child(1) {
            width: 500px; height: 500px;
            background: var(--accent-purple);
            top: -10%; left: -10%;
            animation-duration: 25s;
        }
        .bg-orbs .orb:nth-child(2) {
            width: 400px; height: 400px;
            background: var(--accent-green);
            bottom: -10%; right: -10%;
            animation-duration: 20s;
            animation-delay: -5s;
        }
        .bg-orbs .orb:nth-child(3) {
            width: 300px; height: 300px;
            background: var(--accent-pink);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 30s;
            animation-delay: -10s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -40px) scale(1.05); }
            50% { transform: translate(-20px, 30px) scale(0.95); }
            75% { transform: translate(40px, 20px) scale(1.02); }
        }

        /* ── Auth container ── */
        .auth-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            padding: 20px;
        }

        .brand {
            text-align: center;
        }
        .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }
        .brand-tagline {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
            font-weight: 300;
        }

        /* ── Clerk mount container ── */
        #clerk-auth {
            min-width: 380px;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #clerk-auth .cl-rootBox {
            width: 100% !important;
        }

        /* Loading state */
        .auth-loading {
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .auth-loading .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Error state */
        .auth-error {
            color: var(--accent-pink);
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.6;
        }
        .auth-error a {
            color: var(--accent-green);
            text-decoration: underline;
            cursor: pointer;
        }

        /* ── Customize Clerk's appearance via CSS overrides ── */
        .cl-card {
            background: rgba(13, 13, 20, 0.9) !important;
            border: 1px solid rgba(255,255,255,0.06) !important;
            backdrop-filter: blur(20px) !important;
            border-radius: 16px !important;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5) !important;
        }
        .cl-headerTitle {
            color: var(--text-primary) !important;
        }
        .cl-headerSubtitle {
            color: var(--text-muted) !important;
        }
        .cl-formFieldInput {
            background: rgba(255,255,255,0.04) !important;
            border-color: rgba(255,255,255,0.1) !important;
            color: var(--text-primary) !important;
        }
        .cl-formButtonPrimary {
            background: linear-gradient(135deg, var(--accent-green), #00cc7a) !important;
            color: #000 !important;
            font-weight: 600 !important;
        }
        .cl-footerActionLink {
            color: var(--accent-purple) !important;
        }

        @media (max-width: 480px) {
            .brand-logo { font-size: 2rem; }
            #clerk-auth { min-width: 320px; }
        }
    </style>
</head>
<body>
    <!-- Animated background orbs -->
    <div class="bg-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="auth-wrapper">
        <!-- Brand header -->
        <div class="brand">
            <div class="brand-logo">📚 BOOKIFY</div>
            <div class="brand-tagline">Your intelligent book companion</div>
        </div>

        <!-- Clerk sign-in component mounts here -->
        <div id="clerk-auth">
            <div class="auth-loading">
                <div class="spinner"></div>
                Loading authentication...
            </div>
        </div>
    </div>

    <script>
        const REDIRECT_URL = "{{ redirect_url | default('/') }}";
        const CLERK_PK = "{{ clerk_publishable_key }}";

        // Derive the Frontend API domain from the publishable key
        // pk_test_<base64 encoded domain> or pk_live_<base64 encoded domain>
        function getClerkDomain(pk) {
            const encoded = pk.split('_')[2];
            return atob(encoded).slice(0, -1); // Remove trailing '$'
        }

        (async function initClerk() {
            try {
                const clerkDomain = getClerkDomain(CLERK_PK);
                console.log('Clerk domain:', clerkDomain);

                // 1. Load the Clerk UI bundle first (required for prebuilt components)
                await new Promise((resolve, reject) => {
                    const uiScript = document.createElement('script');
                    uiScript.src = `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`;
                    uiScript.crossOrigin = 'anonymous';
                    uiScript.onload = resolve;
                    uiScript.onerror = () => reject(new Error('Failed to load Clerk UI bundle'));
                    document.head.appendChild(uiScript);
                });

                // 2. Load the Clerk JS SDK
                await new Promise((resolve, reject) => {
                    const sdkScript = document.createElement('script');
                    sdkScript.src = `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`;
                    sdkScript.crossOrigin = 'anonymous';
                    sdkScript.setAttribute('data-clerk-publishable-key', CLERK_PK);
                    sdkScript.onload = resolve;
                    sdkScript.onerror = () => reject(new Error('Failed to load Clerk SDK'));
                    document.head.appendChild(sdkScript);
                });

                // Wait for the global Clerk object to be available
                let attempts = 0;
                while (typeof window.Clerk === 'undefined' && attempts < 100) {
                    await new Promise(r => setTimeout(r, 100));
                    attempts++;
                }

                if (!window.Clerk) {
                    throw new Error('Clerk global not available after loading SDK');
                }

                // 3. Initialize Clerk with the UI bundle reference
                await window.Clerk.load({
                    ui: { ClerkUI: window.__internal_ClerkUICtor },
                    appearance: getClerkAppearance()
                });

                console.log('Clerk loaded successfully');

                if (window.Clerk.user) {
                    // Already signed in — redirect
                    window.location.href = REDIRECT_URL;
                    return;
                }

                // Mount the sign-in component
                const el = document.getElementById('clerk-auth');
                el.innerHTML = ''; // Clear loading spinner
                window.Clerk.mountSignIn(el, {
                    afterSignInUrl: REDIRECT_URL,
                    afterSignUpUrl: '/onboarding',
                    signUpUrl: '/auth',
                });

                // Listen for sign-in events to redirect
                window.Clerk.addListener(({ user }) => {
                    if (user) {
                        window.location.href = REDIRECT_URL;
                    }
                });

            } catch (err) {
                console.error('Clerk initialization error:', err);
                document.getElementById('clerk-auth').innerHTML =
                    '<div class="auth-error">' +
                    '<p>⚠️ Failed to load authentication.</p>' +
                    '<p style="margin-top:4px;font-size:0.8rem;color:#6b6b80;">' + err.message + '</p>' +
                    '<p style="margin-top:8px"><a onclick="location.reload()">Click to refresh</a></p>' +
                    '</div>';
            }
        })();

        function getClerkAppearance() {
            return {
                variables: {
                    colorPrimary: '#00e68a',
                    colorText: '#e8e8ef',
                    colorTextSecondary: '#6b6b80',
                    colorBackground: '#0d0d14',
                    colorInputBackground: 'rgba(255,255,255,0.04)',
                    colorInputText: '#e8e8ef',
                    borderRadius: '12px',
                },
                elements: {
                    card: {
                        backgroundColor: 'rgba(13, 13, 20, 0.9)',
                        border: '1px solid rgba(255,255,255,0.06)',
                        backdropFilter: 'blur(20px)',
                        borderRadius: '16px',
                        boxShadow: '0 20px 60px rgba(0,0,0,0.5)',
                    },
                    formButtonPrimary: {
                        background: 'linear-gradient(135deg, #00e68a, #00cc7a)',
                        color: '#000',
                        fontWeight: '600',
                        border: 'none',
                    },
                    footerActionLink: {
                        color: '#a78bfa',
                    },
                }
            };
        }
    </script>
</body>
</html>
